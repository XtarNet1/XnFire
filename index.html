<body>
    <div id="message"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XnFire Enhanced - Fixed Collision</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 0, 0, 0.5);
        }
        .crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        .crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }
        #joystick {
            position: absolute;
            bottom: 80px;
            left: 80px;
            width: 100px;
            height: 100px;
        }
        #runButton {
            position: absolute;
            bottom: 160px;
            left: 80px;
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.5);
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        #debug-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            border-radius: 5px;
        }
        #controls-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            border-radius: 5px;
        }
        .performance-good { color: #00ff00; }
        .performance-warning { color: #ffff00; }
        .performance-bad { color: #ff0000; }
    </style>
</head>
<body>
    <div class="crosshair"></div>
    <div id="joystick"></div>
    <div id="runButton">RUN</div>
    <div id="debug-info">
        <div>Position: <span id="pos">0, 0, 0</span></div>
        <div>Ground Y: <span id="groundY">0</span></div>
        <div>Velocity: <span id="velocity">0</span></div>
        <div>On Ground: <span id="onGround">true</span></div>
        <div>Slope Angle: <span id="slopeAngle">0°</span></div>
        <div>Inside Building: <span id="insideBuilding">false</span></div>
        <div>Wall Collision: <span id="wallCollision">false</span></div>
        <div>Active Colliders: <span id="activeColliders">0</span></div>
        <div>FPS: <span id="fps">60</span></div>
        <div>Camera Dist: <span id="cameraDist">3.25</span></div>
    </div>
    <div id="controls-info">
        <div>F1: Toggle Debug</div>
        <div>F2: Toggle Wireframe</div>
        <div>F3: Toggle Collision Range</div>
        <div>Joystick: Move</div>
        <div>RUN: Sprint</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(1, 3, 3);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

   // Floor
              const textureLoader = new THREE.TextureLoader();
              const sandBaseColor = textureLoader.load("Grass01_BigUV.jpg");
              const sandNormalMap = textureLoader.load("Grass01_BigUV.jpg");
              const sandHeightMap = textureLoader.load("Grass01_BigUV.jpg");
              const sandAmbientOcclusion = textureLoader.load("Grass01_BigUV.jpg");
      
              const WIDTH = 600;
              const LENGTH = 600;
              const geometry = new THREE.PlaneGeometry(WIDTH, LENGTH, 512, 512);
              const material = new THREE.MeshStandardMaterial({
                  map: sandBaseColor,
                  normalMap: sandNormalMap,
                  displacementMap: sandHeightMap,
                  displacementScale: 0.01,
                  aoMap: sandAmbientOcclusion,
              });
      
              sandBaseColor.wrapS = sandBaseColor.wrapT = THREE.RepeatWrapping;
              sandNormalMap.wrapS = sandNormalMap.wrapT = THREE.RepeatWrapping;
              sandHeightMap.wrapS = sandHeightMap.wrapT = THREE.RepeatWrapping;
              sandAmbientOcclusion.wrapS = sandAmbientOcclusion.wrapT = THREE.RepeatWrapping;
      
              sandBaseColor.repeat.set(100, 100);
              sandNormalMap.repeat.set(100, 100);
              sandHeightMap.repeat.set(100, 100);
              sandAmbientOcclusion.repeat.set(10, 10);
      
              const floor = new THREE.Mesh(geometry, material);
              floor.receiveShadow = true;
              floor.rotation.x = -Math.PI / 2;
              scene.add(floor);
      


        // OrbitControls
        const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.minDistance = 2.0; // Minimum camera distance
        orbitControls.maxDistance = 5.0; // Maximum camera distance
        orbitControls.enablePan = false;
        orbitControls.maxPolarAngle = Math.PI / 1.3 - 0.5;
        orbitControls.target.set(0, 1.5, 9);
        orbitControls.update();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(-60, 100, -10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 60;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Performance monitoring
        class PerformanceMonitor {
            constructor() {
                this.frameCount = 0;
                this.lastTime = performance.now();
                this.fps = 60;
                this.updateInterval = 30; // Update every 30 frames
            }

            update() {
                this.frameCount++;
                
                if (this.frameCount % this.updateInterval === 0) {
                    const currentTime = performance.now();
                    const elapsed = currentTime - this.lastTime;
                    this.fps = Math.round(this.updateInterval / (elapsed / 1000));
                    this.lastTime = currentTime;
                    
                    document.getElementById('fps').textContent = this.fps;
                }
            }
        }

        const performanceMonitor = new PerformanceMonitor();

        // Create terrain with grass texture
        function createTerrain() {
            const WIDTH = 600;
            const LENGTH = 600;
            const geometry = new THREE.PlaneGeometry(WIDTH, LENGTH, 128, 128);
            
            // Add height variation to terrain
            const vertices = geometry.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const z = vertices[i + 2];
                // Create hills and valleys
                const height = Math.sin(x * 0.01) * 3 + Math.cos(z * 0.01) * 2 + 
                              Math.sin(x * 0.005) * 5 + Math.cos(z * 0.008) * 3;
                vertices[i + 1] = height * 0.5; // Y coordinate
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.computeVertexNormals();

            // Create grass material with realistic textures
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Create grass pattern
            const gradient = ctx.createLinearGradient(0, 0, 0, 512);
            gradient.addColorStop(0, '#4a7c59');
            gradient.addColorStop(0.5, '#6b8e23');
            gradient.addColorStop(1, '#228b22');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            // Add grass texture details
            for (let i = 0; i < 1000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const size = Math.random() * 3 + 1;
                ctx.fillStyle = `rgba(${34 + Math.random() * 40}, ${139 + Math.random() * 40}, ${34 + Math.random() * 40}, 0.7)`;
                ctx.fillRect(x, y, size, size * 2);
            }
            
            const grassTexture = new THREE.CanvasTexture(canvas);
            grassTexture.wrapS = grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.repeat.set(50, 50);

            const material = new THREE.MeshStandardMaterial({
                map: grassTexture,
                roughness: 0.8,
                metalness: 0.1,
            });

            const terrain = new THREE.Mesh(geometry, material);
            terrain.receiveShadow = true;
            terrain.rotation.x = -Math.PI / 2;
            terrain.name = 'terrain';
            scene.add(terrain);
            
            return terrain;
        }

        const terrain = createTerrain();

        // Optimized Physics System with reliable collision detection
        class OptimizedPhysicsSystem {
            constructor() {
                this.gravity = -9.81;
                this.buildings = [];
                this.collisionMeshes = [];
                this.activeCollisionMeshes = [];
                this.raycaster = new THREE.Raycaster();
                this.debugMode = false;
                this.debugMeshes = [];
                this.wireframeMode = false;
                this.buildingBounds = [];
                this.maxWalkableSlope = 35;
                
                // Collision optimization settings
                this.collisionRange = 1.5; // meters around character
                this.collisionRanges = [ 5, 10, 15, 20, 30]; // Available ranges
                this.currentRangeIndex = 1; // Default to 10m
                this.lastCharacterPosition = new THREE.Vector3();
                this.updateThreshold = 1.0; // Update collision when character moves this distance
                this.collisionUpdateTimer = 0;
                this.collisionUpdateInterval = 0.1; // Update every 100ms
                
                // Spatial grid for better performance
                this.gridSize = 10; // 10x10 meter grid cells
                this.spatialGrid = new Map();
                
                // Object pool for collision meshes
                this.meshPool = [];
                this.maxPoolSize = 100;
            }

            // Add building for collision
            addBuilding(object) {
                const building = {
                    object: object,
                    bounds: new THREE.Box3().setFromObject(object),
                    meshes: []
                };
                
                // Extract all meshes from the building
                object.traverse((child) => {
                    if (child.isMesh && child.geometry) {
                        const meshData = {
                            mesh: child,
                            geometry: child.geometry,
                            worldMatrix: child.matrixWorld.clone(),
                            bounds: new THREE.Box3().setFromObject(child),
                            active: false
                        };
                        building.meshes.push(meshData);
                    }
                });
                
                this.buildings.push(building);
                
                // Add to building bounds for interior detection
                this.buildingBounds.push({
                    box: building.bounds,
                    floorY: building.bounds.min.y + 0.1,
                    object: object
                });
                
                // Add to spatial grid
                this.addToSpatialGrid(building);
                
                console.log(`Added building with ${building.meshes.length} meshes`);
            }

            // Add building to spatial grid
            addToSpatialGrid(building) {
                const bounds = building.bounds;
                const minX = Math.floor(bounds.min.x / this.gridSize);
                const maxX = Math.floor(bounds.max.x / this.gridSize);
                const minZ = Math.floor(bounds.min.z / this.gridSize);
                const maxZ = Math.floor(bounds.max.z / this.gridSize);
                
                for (let x = minX; x <= maxX; x++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        const key = `${x},${z}`;
                        if (!this.spatialGrid.has(key)) {
                            this.spatialGrid.set(key, []);
                        }
                        this.spatialGrid.get(key).push(building);
                    }
                }
            }

            // Get nearby buildings based on character position
            getNearbyBuildings(position) {
                const nearbyBuildings = new Set();
                const range = this.collisionRange;
                
                const minX = Math.floor((position.x - range) / this.gridSize);
                const maxX = Math.floor((position.x + range) / this.gridSize);
                const minZ = Math.floor((position.z - range) / this.gridSize);
                const maxZ = Math.floor((position.z + range) / this.gridSize);
                
                for (let x = minX; x <= maxX; x++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        const key = `${x},${z}`;
                        const buildings = this.spatialGrid.get(key);
                        if (buildings) {
                            buildings.forEach(building => {
                                nearbyBuildings.add(building);
                            });
                        }
                    }
                }
                
                return Array.from(nearbyBuildings);
            }

            // Update collision meshes based on character position
            updateCollisionMeshes(characterPos) {
                // Clear active collision meshes
                this.activeCollisionMeshes = [];
                
                // Clear debug meshes
                if (this.debugMode) {
                    this.debugMeshes.forEach(mesh => scene.remove(mesh));
                    this.debugMeshes = [];
                }
                
                // Get nearby buildings
                const nearbyBuildings = this.getNearbyBuildings(characterPos);
                let activeCount = 0;
                
                // Process each nearby building
                for (const building of nearbyBuildings) {
                    // Check if building is within range
                    if (building.bounds.distanceToPoint(characterPos) > this.collisionRange) {
                        continue;
                    }
                    
                    // Process each mesh in the building
                    for (const meshData of building.meshes) {
                        // Check if mesh is within range
                        if (meshData.bounds.distanceToPoint(characterPos) <= this.collisionRange) {
                            // Create collision mesh
                            const worldGeometry = meshData.geometry.clone();
                            worldGeometry.applyMatrix4(meshData.worldMatrix);
                            
                            const collisionMesh = this.getCollisionMesh();
                            collisionMesh.geometry = worldGeometry;
                            collisionMesh.userData.originalName = meshData.mesh.name || 'unnamed';
                            
                            this.activeCollisionMeshes.push(collisionMesh);
                            activeCount++;
                            
                            // Add debug visualization
                            if (this.debugMode) {
                                const debugMaterial = new THREE.MeshBasicMaterial({
                                    color: 0xff0000,
                                    wireframe: true,
                                    transparent: true,
                                    opacity: 0.5
                                });
                                const debugMesh = new THREE.Mesh(worldGeometry, debugMaterial);
                                this.debugMeshes.push(debugMesh);
                                scene.add(debugMesh);
                            }
                        }
                    }
                }
                
                // Update debug info
                document.getElementById('activeColliders').textContent = activeCount;
                
                console.log(`Updated collision system: ${activeCount} active meshes within ${this.collisionRange}m`);
            }

            // Get a collision mesh from the pool or create a new one
            getCollisionMesh() {
                if (this.meshPool.length > 0) {
                    return this.meshPool.pop();
                }
                return new THREE.Mesh();
            }

            // Release a collision mesh back to the pool
            releaseCollisionMesh(mesh) {
                if (this.meshPool.length < this.maxPoolSize) {
                    mesh.geometry = null;
                    this.meshPool.push(mesh);
                }
            }

            // Check if collision update is needed
            shouldUpdateCollision(characterPos, deltaTime) {
                this.collisionUpdateTimer += deltaTime;
                
                const distanceMoved = characterPos.distanceTo(this.lastCharacterPosition);
                const timeToUpdate = this.collisionUpdateTimer >= this.collisionUpdateInterval;
                const movedEnough = distanceMoved >= this.updateThreshold;
                
                return timeToUpdate && (movedEnough || this.activeCollisionMeshes.length === 0);
            }

            // Main update function called each frame
            updateCollisionSystem(characterPos, deltaTime) {
                if (this.shouldUpdateCollision(characterPos, deltaTime)) {
                    this.updateCollisionMeshes(characterPos);
                    this.lastCharacterPosition.copy(characterPos);
                    this.collisionUpdateTimer = 0;
                }
            }

            // Toggle collision range
            toggleCollisionRange() {
                this.currentRangeIndex = (this.currentRangeIndex + 1) % this.collisionRanges.length;
                this.collisionRange = this.collisionRanges[this.currentRangeIndex];
                console.log(`Collision range set to ${this.collisionRange}m`);
                
                // Force immediate update
                this.collisionUpdateTimer = this.collisionUpdateInterval;
            }

            // Get terrain height at position
            getTerrainHeight(x, z) {
                const raycaster = new THREE.Raycaster();
                raycaster.set(new THREE.Vector3(x, 50, z), new THREE.Vector3(0, -1, 0));
                const intersects = raycaster.intersectObject(terrain);
                
                if (intersects.length > 0) {
                    return intersects[0].point.y;
                }
                return 0;
            }

            // Check if position is inside a building
            isInsideBuilding(position) {
                for (let building of this.buildingBounds) {
                    if (building.box.containsPoint(position)) {
                        return {
                            inside: true,
                            floorY: building.floorY,
                            building: building.object
                        };
                    }
                }
                return { inside: false, floorY: null, building: null };
            }

            // Enhanced ground detection with slope checking
            getGroundInfo(position, radius = 0.5) {
                const buildingInfo = this.isInsideBuilding(position);
                const terrainHeight = this.getTerrainHeight(position.x, position.z);
                
                // Multiple raycasts for better ground detection
                const rayPositions = [
                    new THREE.Vector3(position.x, position.y + 10, position.z),
                    new THREE.Vector3(position.x + radius * 0.5, position.y + 10, position.z),
                    new THREE.Vector3(position.x - radius * 0.5, position.y + 10, position.z),
                    new THREE.Vector3(position.x, position.y + 10, position.z + radius * 0.5),
                    new THREE.Vector3(position.x, position.y + 10, position.z - radius * 0.5)
                ];
                
                let bestY = terrainHeight;
                let bestSurface = null;
                let bestNormal = new THREE.Vector3(0, 1, 0);
                
                for (let rayPos of rayPositions) {
                    this.raycaster.set(rayPos, new THREE.Vector3(0, -1, 0));
                    const intersects = this.raycaster.intersectObjects(this.activeCollisionMeshes);
                    
                    for (let hit of intersects) {
                        const surfaceY = hit.point.y;
                        if (surfaceY <= position.y + 2 && surfaceY > bestY) {
                            bestSurface = hit;
                            bestY = surfaceY;
                            bestNormal = hit.face.normal.clone();
                        }
                    }
                }
                
                // If inside building, prefer building floor
                if (buildingInfo.inside && buildingInfo.floorY > bestY) {
                    bestY = buildingInfo.floorY;
                    bestNormal = new THREE.Vector3(0, 1, 0);
                }
                
                const slopeAngle = Math.acos(Math.abs(bestNormal.dot(new THREE.Vector3(0, 1, 0)))) * (180 / Math.PI);
                
                return {
                    groundY: bestY,
                    normal: bestNormal,
                    slopeAngle: slopeAngle,
                    canWalk: slopeAngle < this.maxWalkableSlope,
                    hit: bestSurface,
                    insideBuilding: buildingInfo.inside,
                    terrainHeight: terrainHeight
                };
            }

            // Enhanced collision resolution with proper wall climbing prevention
            resolveCollision(currentPos, targetPos, radius = 0.4, height = 1.8) {
                let correctedPos = targetPos.clone();
                let hasCollision = false;
                const maxIterations = 3;
                
                // Multiple collision check points at different heights
                const checkHeights = [0.2, height * 0.5, height * 0.8];
                
                for (let iteration = 0; iteration < maxIterations; iteration++) {
                    let iterationHasCollision = false;
                    
                    // Check horizontal collisions at multiple heights
                    for (let checkHeight of checkHeights) {
                        const directions = [
                            new THREE.Vector3(1, 0, 0),   // Right
                            new THREE.Vector3(-1, 0, 0),  // Left
                            new THREE.Vector3(0, 0, 1),   // Forward
                            new THREE.Vector3(0, 0, -1),  // Backward
                            // Diagonal directions for better corner detection
                            new THREE.Vector3(0.707, 0, 0.707),
                            new THREE.Vector3(-0.707, 0, 0.707),
                            new THREE.Vector3(0.707, 0, -0.707),
                            new THREE.Vector3(-0.707, 0, -0.707)
                        ];

                        for (let dir of directions) {
                            const rayOrigin = new THREE.Vector3(
                                correctedPos.x, 
                                correctedPos.y + checkHeight, 
                                correctedPos.z
                            );
                            
                            this.raycaster.set(rayOrigin, dir);
                            const intersects = this.raycaster.intersectObjects(this.activeCollisionMeshes);
                            
                            if (intersects.length > 0 && intersects[0].distance < radius + 0.1) {
                                const hit = intersects[0];
                                const meshName = hit.object.userData.originalName || '';
                                
                                // Allow movement through doors
                                if (meshName.toLowerCase().includes('door')) {
                                    continue;
                                }
                                
                                hasCollision = true;
                                iterationHasCollision = true;
                                
                                // Get surface normal
                                let normal = hit.face.normal.clone();
                                
                                // Check if this is a wall (steep surface)
                                const surfaceAngle = Math.acos(Math.abs(normal.dot(new THREE.Vector3(0, 1, 0)))) * (180 / Math.PI);
                                
                                if (surfaceAngle > this.maxWalkableSlope) {
                                    // This is a wall - prevent climbing
                                    normal.y = 0; // Keep horizontal only
                                    normal.normalize();
                                    
                                    // Push away from wall
                                    const penetration = (radius + 0.1) - hit.distance + 0.02;
                                    const pushVector = normal.clone().multiplyScalar(penetration);
                                    correctedPos.add(pushVector);
                                    
                                    // Implement wall sliding
                                    const movement = targetPos.clone().sub(currentPos);
                                    movement.y = 0; // Keep horizontal
                                    
                                    // Calculate slide direction (perpendicular to wall normal)
                                    const slideDirection = movement.clone().sub(
                                        normal.clone().multiplyScalar(movement.dot(normal))
                                    );
                                    
                                    if (slideDirection.length() > 0.01) {
                                        // Allow sliding along the wall with reduced speed
                                        const slideAmount = slideDirection.multiplyScalar(0.6);
                                        correctedPos = currentPos.clone().add(slideAmount);
                                        correctedPos.y = targetPos.y; // Preserve vertical movement
                                    }
                                }
                            }
                        }
                    }
                    
                    // Check ground collision for steep slopes
                    const groundInfo = this.getGroundInfo(correctedPos, radius);
                    if (!groundInfo.canWalk && groundInfo.slopeAngle > this.maxWalkableSlope) {
                        // On too steep slope - slide down or prevent movement
                        const slopeNormal = groundInfo.normal.clone();
                        const horizontalMovement = targetPos.clone().sub(currentPos);
                        horizontalMovement.y = 0;
                        
                        // If trying to move up steep slope, prevent it
                        const movementDot = horizontalMovement.dot(slopeNormal);
                        if (movementDot > 0) {
                            // Trying to move up steep slope - stop movement
                            correctedPos.x = currentPos.x;
                            correctedPos.z = currentPos.z;
                            hasCollision = true;
                        }
                    }
                    
                    if (!iterationHasCollision) break;
                }

                return {
                    position: correctedPos,
                    hasCollision: hasCollision
                };
            }

            // Check if character can step up (for stairs/small obstacles)
            canStepUp(currentPos, targetPos, stepHeight = 0.3) {
                const rayOrigin = new THREE.Vector3(targetPos.x, currentPos.y + stepHeight, targetPos.z);
                const rayDirection = new THREE.Vector3(0, -1, 0);
                
                this.raycaster.set(rayOrigin, rayDirection);
                const intersects = this.raycaster.intersectObjects(this.activeCollisionMeshes);
                
                if (intersects.length > 0) {
                    const stepSurface = intersects[0];
                    const stepY = stepSurface.point.y;
                    const heightDiff = stepY - currentPos.y;
                    
                    // Check if step is reasonable height and surface is walkable
                    if (heightDiff > 0.05 && heightDiff <= stepHeight) {
                        const normal = stepSurface.face.normal;
                        const slopeAngle = Math.acos(Math.abs(normal.dot(new THREE.Vector3(0, 1, 0)))) * (180 / Math.PI);
                        
                        if (slopeAngle < this.maxWalkableSlope) {
                            return { canStep: true, stepY: stepY };
                        }
                    }
                }
                
                return { canStep: false, stepY: currentPos.y };
            }

            toggleDebug() {
                this.debugMode = !this.debugMode;
                
                if (!this.debugMode) {
                    this.debugMeshes.forEach(mesh => {
                        scene.remove(mesh);
                    });
                    this.debugMeshes = [];
                } else {
                    // Force collision update to show debug meshes
                    this.collisionUpdateTimer = this.collisionUpdateInterval;
                }
            }

            toggleWireframe() {
                this.wireframeMode = !this.wireframeMode;
                
                scene.traverse((child) => {
                    if (child.isMesh && child.material && child.name !== 'terrain') {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => {
                                mat.wireframe = this.wireframeMode;
                            });
                        } else {
                            child.material.wireframe = this.wireframeMode;
                        }
                    }
                });
            }
        }

        const physicsSystem = new OptimizedPhysicsSystem();

        // Enhanced Character Controller
        class CharacterController {
            constructor(model, mixer, animationsMap, orbitControl, camera, currentAction) {
                this.model = model;
                this.mixer = mixer;
                this.animationsMap = animationsMap;
                this.orbitControl = orbitControl;
                this.camera = camera;
                this.currentAction = currentAction;
                
                // Movement properties
                this.walkDirection = new THREE.Vector3();
                this.rotateAngle = new THREE.Vector3(0, 1, 0);
                this.rotateQuarternion = new THREE.Quaternion();
                this.cameraTarget = new THREE.Vector3();
                this.fadeDuration = 0.2;
                this.runVelocity = 5;
                this.walkVelocity = 2;
                
                // Physics properties
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.characterRadius = 0.4;
                this.characterHeight = 1.8;
                this.isGrounded = false;
                this.groundY = 0;
                this.currentGroundInfo = null;
                this.insideBuilding = false;
                this.hasWallCollision = false;

                // Camera properties
                this.idealCameraDistance = 3.25;
                this.minCameraDistance = 0.4;
                this.maxCameraDistance = 5.0;
                this.currentCameraDistance = this.idealCameraDistance;
                this.cameraCollisionOffset = 0.3; // Keep camera this far from obstacles
                this.cameraAdjustSpeed = 20; // How quickly camera adjusts to obstacles
                this.insideBuildingCameraDistance = 3; // Camera distance when inside building

                this.animationsMap.forEach((value, key) => {
                    if (key == currentAction) {
                        value.play();
                    }
                });
                this.updateCameraTarget(0, 0);
            }

            update(delta, joystickVector, isRunning) {
                const directionPressed = Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1;

                // Update collision system based on character position
                physicsSystem.updateCollisionSystem(this.model.position, delta);

                // Animation handling
                let play = '';
                if (directionPressed && isRunning) {
                    play = 'Run';
                } else if (directionPressed) {
                    play = 'Walk';
                } else {
                    play = 'Idle';
                }

                if (this.currentAction != play) {
                    const toPlay = this.animationsMap.get(play);
                    const current = this.animationsMap.get(this.currentAction);

                    if (current) current.fadeOut(this.fadeDuration);
                    if (toPlay) toPlay.reset().fadeIn(this.fadeDuration).play();

                    this.currentAction = play;
                }

                this.mixer.update(delta);
                this.updatePhysics(delta, joystickVector, isRunning, directionPressed);
                
                // Update camera distance based on environment
                this.updateCameraDistance(delta);
            }

            updatePhysics(delta, joystickVector, isRunning, directionPressed) {
                const currentPos = this.model.position.clone();
                
                // Get ground information
                this.currentGroundInfo = physicsSystem.getGroundInfo(currentPos, this.characterRadius);
                this.groundY = this.currentGroundInfo.groundY;
                this.isGrounded = Math.abs(currentPos.y - this.groundY) < 0.2;
                this.insideBuilding = this.currentGroundInfo.insideBuilding;

                // Apply gravity
                if (!this.isGrounded) {
                    this.velocity.y += physicsSystem.gravity * delta;
                } else {
                    this.velocity.y = 0;
                    // Smoothly adjust to ground level
                    const targetY = this.groundY;
                    this.model.position.y = THREE.MathUtils.lerp(this.model.position.y, targetY, 0.15);
                }

                // Horizontal movement
                if (directionPressed) {
                    const reversedJoystickVector = { x: joystickVector.x, y: -joystickVector.y };
                    
                    const angleYCameraDirection = Math.atan2(
                        (this.camera.position.x - this.model.position.x),
                        (this.camera.position.z - this.model.position.z)
                    );
                    const directionOffset = Math.atan2(-reversedJoystickVector.x, -reversedJoystickVector.y);

                    this.rotateQuarternion.setFromAxisAngle(this.rotateAngle, angleYCameraDirection + directionOffset);
                    this.model.quaternion.rotateTowards(this.rotateQuarternion, 0.2);

                    this.camera.getWorldDirection(this.walkDirection);
                    this.walkDirection.y = 0;
                    this.walkDirection.normalize();
                    this.walkDirection.applyAxisAngle(this.rotateAngle, directionOffset);

                    const velocity = isRunning ? this.runVelocity : this.walkVelocity;
                    
                    const moveX = this.walkDirection.x * velocity * delta;
                    const moveZ = this.walkDirection.z * velocity * delta;
                    
                    let targetPos = new THREE.Vector3(
                        currentPos.x + moveX,
                        currentPos.y + this.velocity.y * delta,
                        currentPos.z + moveZ
                    );

                    // Check for step up possibility
                    const stepInfo = physicsSystem.canStepUp(currentPos, targetPos, 0.3);
                    if (stepInfo.canStep) {
                        targetPos.y = stepInfo.stepY;
                    }

                    // Resolve collisions with enhanced system
                    const collision = physicsSystem.resolveCollision(
                        currentPos, 
                        targetPos, 
                        this.characterRadius, 
                        this.characterHeight
                    );

                    const newPos = collision.position;
                    this.hasWallCollision = collision.hasCollision;
                    
                    // Check if movement is on walkable surface
                    const newGroundInfo = physicsSystem.getGroundInfo(newPos, this.characterRadius);
                    
                    if (newGroundInfo.canWalk || this.isGrounded) {
                        const actualMoveX = newPos.x - currentPos.x;
                        const actualMoveZ = newPos.z - currentPos.z;
                        
                        this.model.position.x = newPos.x;
                        this.model.position.z = newPos.z;
                        
                        // Update ground after movement
                        if (this.isGrounded || stepInfo.canStep) {
                            this.model.position.y = newGroundInfo.groundY;
                        }
                        
                        this.updateCameraTarget(actualMoveX, actualMoveZ);
                    } else {
                        // Can't walk on this surface - stay in place
                        this.hasWallCollision = true;
                    }
                } else {
                    // Apply gravity when stationary
                    if (!this.isGrounded) {
                        this.model.position.y += this.velocity.y * delta;
                        if (this.model.position.y <= this.groundY) {
                            this.model.position.y = this.groundY;
                            this.isGrounded = true;
                            this.velocity.y = 0;
                        }
                    }
                    this.hasWallCollision = false;
                }

                this.updateDebugInfo();
            }

            // Update camera distance based on obstacles and environment
            updateCameraDistance(delta) {
                // Determine ideal distance based on environment
                let targetDistance = this.idealCameraDistance;
                
                // If inside building, use closer camera distance
                if (this.insideBuilding) {
                    targetDistance = this.insideBuildingCameraDistance;
                }
                
                // Check for obstacles between character and camera
                const cameraPosition = this.camera.position.clone();
                const characterHead = new THREE.Vector3(
                    this.model.position.x,
                    this.model.position.y + 1.5, // Camera looks at character's head level
                    this.model.position.z
                );
                
                // Direction from character to camera
                const cameraDirection = cameraPosition.clone().sub(characterHead).normalize();
                
                // Raycast from character to camera to check for obstacles
                physicsSystem.raycaster.set(characterHead, cameraDirection);
                const intersects = physicsSystem.raycaster.intersectObjects(physicsSystem.activeCollisionMeshes);
                
                if (intersects.length > 0 && intersects[0].distance < targetDistance) {
                    // There's an obstacle between character and camera
                    // Set camera distance to be just in front of the obstacle
                    targetDistance = Math.max(intersects[0].distance - this.cameraCollisionOffset, this.minCameraDistance);
                }
                
                // Smoothly adjust camera distance
                this.currentCameraDistance = THREE.MathUtils.lerp(
                    this.currentCameraDistance,
                    targetDistance,
                    this.cameraAdjustSpeed * delta
                );
                
                // Update orbit controls distance
                this.orbitControl.minDistance = this.minCameraDistance;
                this.orbitControl.maxDistance = this.maxCameraDistance;
                this.orbitControl.target = this.cameraTarget;
                this.orbitControl.object.position.copy(characterHead).add(
                    cameraDirection.multiplyScalar(this.currentCameraDistance)
                );
                this.orbitControl.update();
                
                // Update debug info
                document.getElementById('cameraDist').textContent = this.currentCameraDistance.toFixed(2);
            }

            updateCameraTarget(moveX, moveZ) {
                this.cameraTarget.x = this.model.position.x;
                this.cameraTarget.y = this.model.position.y + 1.5;
                this.cameraTarget.z = this.model.position.z;
                this.orbitControl.target = this.cameraTarget;
            }

            updateDebugInfo() {
                const pos = this.model.position;
                document.getElementById('pos').textContent = 
                    `${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)}`;
                document.getElementById('groundY').textContent = this.groundY.toFixed(2);
                document.getElementById('velocity').textContent = this.velocity.length().toFixed(2);
                document.getElementById('onGround').textContent = this.isGrounded;
                document.getElementById('insideBuilding').textContent = this.insideBuilding;
                document.getElementById('wallCollision').textContent = this.hasWallCollision;
                
                if (this.currentGroundInfo) {
                    document.getElementById('slopeAngle').textContent = 
                        this.currentGroundInfo.slopeAngle.toFixed(1) + '°';
                }
            }
        }

        // Model loading
        const loader = new THREE.GLTFLoader();
        let characterController;
        
        // Load character model
        loader.load("mks.glb", (gltf) => {
            const model = gltf.scene;
            model.position.set(0, 2, 0);
            model.traverse((object) => {
                if (object.isMesh) object.castShadow = true;
            });
            scene.add(model);

            const mixer = new THREE.AnimationMixer(model);
            const animationsMap = new Map();
            gltf.animations.filter(a => a.name !== 'TPose').forEach((a) => {
                animationsMap.set(a.name, mixer.clipAction(a));
            });

            characterController = new CharacterController(model, mixer, animationsMap, orbitControls, camera, 'Idle');
        }, undefined, (error) => {
            console.log("Character model not found, creating placeholder");
            // Create a simple placeholder character
            const geometry = new THREE.CapsuleGeometry(0.3, 1.5, 4, 8);
            const material = new THREE.MeshStandardMaterial({ color: 0x0077ff });
            const model = new THREE.Mesh(geometry, material);
            model.position.set(0, 0.75, 0);
            model.castShadow = true;
            scene.add(model);
            
            // Create simple animations
            const mixer = new THREE.AnimationMixer(model);
            const animationsMap = new Map();
            animationsMap.set('Idle', mixer.clipAction(new THREE.AnimationClip('Idle', -1, [])));
            animationsMap.set('Walk', mixer.clipAction(new THREE.AnimationClip('Walk', -1, [])));
            animationsMap.set('Run', mixer.clipAction(new THREE.AnimationClip('Run', -1, [])));
            
            characterController = new CharacterController(model, mixer, animationsMap, orbitControls, camera, 'Idle');
        });

        // Load building model
       loader.load("modular_old_wooden_barn_and_fence.glb", (gltf) => {
    const building = gltf.scene;

    // Set position
    building.position.set(0, -0.2, 0);

    // Scale building to approx 1000 units in size
    const targetSize = 12;
    const box = new THREE.Box3().setFromObject(building);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDimension = Math.max(size.x, size.y, size.z);
    const scaleFactor = targetSize / maxDimension;
    building.scale.setScalar(scaleFactor); // Uniform scaling

    // Enable shadows
    building.traverse((object) => {
        if (object.isMesh) {
            object.receiveShadow = true;
            object.castShadow = true;
        }
    });

    // Add to scene and physics system
    scene.add(building);
    physicsSystem.addBuilding(building);
}
, undefined, (error) => {
            console.log("Building model not found, creating placeholder building");
            // Create a simple building
            const buildingGroup = new THREE.Group();
            
            // Main building
            const buildingGeom = new THREE.BoxGeometry(20, 15, 20);
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const buildingMesh = new THREE.Mesh(buildingGeom, buildingMat);
            buildingMesh.position.set(0, 7.5, 0);
            buildingMesh.castShadow = true;
            buildingMesh.receiveShadow = true;
            buildingGroup.add(buildingMesh);
            
            // Create stairs
            for (let i = 0; i < 8; i++) {
                const stepGeom = new THREE.BoxGeometry(12, 1, 2);
                const stepMat = new THREE.MeshStandardMaterial({ color: 0x696969 });
                const step = new THREE.Mesh(stepGeom, stepMat);
                step.position.set(0, i * 0.5, -12 + i * 1.5);
                step.castShadow = true;
                step.receiveShadow = true;
                buildingGroup.add(step);
            }
            
            // Roof
            const roofGeom = new THREE.ConeGeometry(15, 8, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
            const roof = new THREE.Mesh(roofGeom, roofMat);
            roof.position.set(0, 19, 0);
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            buildingGroup.add(roof);
            
            buildingGroup.position.set(25, 0, 10);
            scene.add(buildingGroup);
            physicsSystem.addBuilding(buildingGroup);
        });

        // Load clock tower
        loader.load("sc.glb", (gltf) => {
            const clockTower = gltf.scene;
            clockTower.position.set(6, 0.51, 4);
            clockTower.traverse((object) => {
                if (object.isMesh) {
                    object.receiveShadow = true;
                    object.castShadow = true;
                }
            });
            scene.add(clockTower);
            physicsSystem.addBuilding(clockTower);
        }, undefined, (error) => {
            console.log("Clock tower model not found, creating placeholder tower");
            const towerGeom = new THREE.CylinderGeometry(2, 3, 12, 8);
            const towerMat = new THREE.MeshStandardMaterial({ color: 0x4682B4 });
            const tower = new THREE.Mesh(towerGeom, towerMat);
            tower.position.set(6, 6, 4);
            tower.castShadow = true;
            tower.receiveShadow = true;
            scene.add(tower);
            physicsSystem.addBuilding(tower);
        });

        // Joystick setup
        const joystickElement = document.getElementById('joystick');
        const joystick = nipplejs.create({
            zone: joystickElement,
            color: 'blue',
            size: 100,
            multitouch: true,
            mode: 'static',
            position: { bottom: '20px', left: '20px' }
        });

        let joystickVector = { x: 0, y: 0 };

        joystick.on('move', (event, data) => {
            joystickVector = data.vector;
        });

        joystick.on('end', () => {
            joystickVector = { x: 0, y: 0 };
        });

        // Run button
        const runButton = document.getElementById('runButton');
        let isRunning = false;

        runButton.addEventListener('mousedown', () => { isRunning = true; });
        runButton.addEventListener('mouseup', () => { isRunning = false; });
        runButton.addEventListener('touchstart', (e) => { e.preventDefault(); isRunning = true; });
        runButton.addEventListener('touchend', (e) => { e.preventDefault(); isRunning = false; });

        // Debug controls
        document.addEventListener('keydown', (event) => {
            if (event.key === 'F1') {
                physicsSystem.toggleDebug();
            }
            if (event.key === 'F2') {
                physicsSystem.toggleWireframe();
            }
            if (event.key === 'F3') {
                physicsSystem.toggleCollisionRange();
            }
        });

        // Prevent default touch behavior
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Animation loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (characterController) {
                characterController.update(delta, joystickVector, isRunning);
            }

            orbitControls.update();
            renderer.render(scene, camera);
            
            // Update performance monitor
            performanceMonitor.update();
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth / window.innerHeight);
        });
    </script>
</body>

        </div>

    <script>
        function requestFullscreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else if (document.documentElement.webkitRequestFullscreen) { // Safari
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) { // IE11
                document.documentElement.msRequestFullscreen();
            }
        }

        // Attempt to enter fullscreen on page load
        window.onload = () => {
            requestFullscreen();
        };

        // Alternative: Ask user to click if fullscreen is blocked by the browser
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                requestFullscreen();
            }
        });
    </script>
